<html lang="pt-br">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>1</title>
        <script>

            //    Questão 1
            var temperatura = Number(prompt('Informe uma temperatura em graus Celsius:'))

            if (temperatura < 18){
                alert('Está Frio')
            } 
            else if (temperatura > 18 && temperatura < 28){
                alert('Temperatura agradavel')
            } 
            
            else if (temperatura > 28){
                alert('Está quente')
            }

           
        </script>
    </head>
</html>
