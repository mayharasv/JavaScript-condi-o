<html lang="pt-br">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>4</title>
        <script>
       
            //    Questão 4
            var nota = Number(prompt('Informe a nota de um aluno:'))

            if (nota >= 9){
                alert('Excelente')
            } else if(nota >= 7 && nota <= 8){
                alert('Bom')
            } else if (nota >= 5 && nota <= 6){
                alert('Regular')
            } else if(nota <= 4){
                alert('Insuficiente')
            }


           
        </script>
    </head>
</html>
