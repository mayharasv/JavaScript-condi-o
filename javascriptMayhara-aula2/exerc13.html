<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>13</title>
        <script>
       
            //    Questão 13
            var hora = Number(prompt('Digite uma hora entre 0 e 23:'))

            if (hora >=5 && hora <= 11){
                alert('Bom dia')
            } else if(hora >=12 && hora <=17){
                alert('Boa tarde')
            } else if(hora >= 18 && hora <=23){
                alert('Boa noite')
            } else if (hora >= 0 && hora <=4){
                alert("Boa madrugada")
            } else if (hora != 0 && hora != 23){
                alert('Erro!')
            }


           
        </script>
    </head>
</html>
