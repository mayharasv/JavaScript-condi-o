<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>7</title>
        <script>
        
            //    Questão 7
            var idade = Number(prompt('idade:'))

            if (idade <= 12){
                alert('Criança')
            } else if(idade >= 13 && idade <= 17){
                alert('Adolescente')
            } else if(idade >= 18 && idade <= 59){
                alert('Adulto')
            } else if (idade >= 60){
                alert('Idoso')
            }


           
        </script>
    </head>
</html>
