<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>9</title>
        <script>
      
            //    Questão 9
            var num1 = Number(prompt('Digite o primeiro número:'))
            var num2 = Number(prompt('Digite o segundo número:'))
            var operacao = prompt('Digite uma operação matematica:')

            if (operacao == '+'){
                alert(num1 + num2)
            }else if (operacao == '-'){
                alert(num1 - num2)
            }else if (operacao == '*'){
                alert(num1 * num2)
            }else if (operacao == '/'){
                alert(num1 / num2)
            }
        


           
        </script>
    </head>
</html>
