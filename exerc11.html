<html lang="pt-br">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>11</title>
        <script>
        
            //    Questão 11
            var salario = Number(prompt('Salário:'))

            if (salario < 2000){
                alert('Salário baixo')
            } else if(salario >= 2000 && salario <= 5000){
                alert('Salário médio')
            } else if (salario > 5000){
                alert('Salário alto')
            }
            


           
        </script>
    </head>
</html>
